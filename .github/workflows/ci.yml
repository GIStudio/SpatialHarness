name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: MCP typecheck
        run: pnpm mcp:typecheck

      - name: MCP unit tests
        run: pnpm mcp:test

      - name: MCP build
        run: pnpm mcp:build

      - name: MCP smoke (stdio end-to-end)
        run: pnpm mcp:smoke
